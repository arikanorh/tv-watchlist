<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e222d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Watchlist</title>
<style>
  /* Mobile first. Phone: one pane at a time (list or chart) behind a two-tab nav; what you read sits at the top
     (header), what you tap sits at the bottom (dock, chart bar, nav, sheets). ≥768px: list | chart side by side. */
  :root {
    --bg: #131722; --bg2: #1e222d; --bg3: #2a2e39; --line: #2a2e39;
    --text: #d1d4dc; --muted: #787b86; --accent: #2962ff; --accent-bg: #1c2a52;
    --up: #089981; --down: #f23645; --pre: #f7a600; --post: #4f8cff; --night: #b06cff;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --nav-h: 52px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; padding-top: var(--safe-t); }
  @media (display-mode: standalone) { body { position: fixed; inset: 0; height: auto; } }
  /* iOS home-screen apps can stop the web view short of the screen bottom; the native strip below is painted with the
     manifest background_color (= nav color) and any root canvas that shows matches it too. */
  @media (max-width: 767.98px) { html { background: var(--bg2); } body { background: var(--bg); } }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  svg { display: block; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* ---------- Header: list status (list pane) / symbol status (chart pane), session tint, feed status ---------- */
  .top { flex-shrink: 0; display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 14px; min-width: 0;
    background: var(--bg2); border-bottom: 1px solid var(--line); }
  body.sess-open .top { background: #18302e; }  body.sess-pre .top { background: #2e2a24; }
  body.sess-post .top { background: #1d2740; } body.sess-night .top { background: #272140; }
  .hl, .hs { display: flex; align-items: baseline; gap: 10px; min-width: 0; font-variant-numeric: tabular-nums; }
  .hl b, .hs b { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .hl .v { font-size: 17px; font-weight: 600; }
  .hs { text-align: left; }
  .hs .px { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .hs .chg { font-size: 14px; white-space: nowrap; }
  .hs .d { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sp { flex: 1; }
  .sess { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sess i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  body.sess-open .sess i { background: var(--up); } body.sess-pre .sess i { background: var(--pre); }
  body.sess-post .sess i { background: var(--post); } body.sess-night .sess i { background: var(--night); }
  .tick { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tick .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .tick .dot.live { background: var(--up); } .tick .dot.off { background: var(--down); } .tick .dot.poll { background: var(--pre); }
  .tick.pulse span { animation: pulse .6s ease-out; }
  @keyframes pulse { 0% { color: var(--text); } 100% { color: var(--muted); } }
  .hbtn { display: none; width: 34px; height: 34px; border-radius: 8px; align-items: center; justify-content: center; color: var(--muted); }
  .hbtn svg { width: 18px; height: 18px; }
  .hver { display: none; font-size: 11px; color: var(--muted); }
  /* phones: the header follows the pane on screen */
  .hs { display: none; }
  body[data-view="chart"] .hl { display: none; }
  body[data-view="chart"] .hs { display: flex; }
  @media (max-width: 380px) { .sess span { display: none; } }

  /* ---------- Panes ---------- */
  .main { flex: 1; min-height: 0; display: flex; }
  .pane { display: none; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
  body[data-view="list"] .listpane, body[data-view="chart"] .chartpane { display: flex; }

  /* List table */
  .cols, .row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 72px 76px; gap: 8px; align-items: center; padding: 0 14px; }
  body.regular .cols, body.regular .row { grid-template-columns: minmax(0, 1fr) 96px 72px; }
  body.regular .cols .x, body.regular .row .ext { display: none; }
  .cols { flex-shrink: 0; height: 30px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .cols span:not(:first-child) { text-align: right; }
  .rows { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .row { position: relative; height: 48px; border-bottom: 1px solid rgba(42, 46, 57, .55); cursor: pointer; font-variant-numeric: tabular-nums;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y; background: var(--bg); transition: transform .12s, box-shadow .12s; }
  .row.on { background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .row .sym { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .row .sym b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.nochart .sym b { color: var(--muted); font-weight: 500; }
  .row .px, .row .chg, .row .ext { text-align: right; white-space: nowrap; }
  .row .ext { display: flex; align-items: center; justify-content: flex-end; gap: 5px; font-size: 13px; }
  .ss { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .ss.pre { background: var(--pre); } .ss.post { background: var(--post); } .ss.night { background: var(--night); }
  .earn { flex-shrink: 0; font-style: normal; font-size: 10px; font-weight: 600; line-height: 1; padding: 3px 5px; border-radius: 4px;
    color: var(--pre); border: 1px solid rgba(247, 166, 0, .55); }
  .earn.soon { background: var(--pre); color: var(--bg); }
  .row .more { display: none; }
  .row.lift { background: var(--bg3); box-shadow: 0 8px 22px rgba(0, 0, 0, .55); transform: scale(1.015); z-index: 3; }
  .row.dragging { opacity: .55; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .gh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; background: var(--bg3);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .gh .chev { color: var(--muted); font-size: 9px; transition: transform .15s; }
  .gh.collapsed .chev { transform: rotate(-90deg); }
  .gh .gc { margin-left: auto; color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .gh.static { cursor: default; }
  .gh.drop-into { box-shadow: inset 0 0 0 1px var(--accent); }
  .flash { animation: flash .9s ease-out; border-radius: 3px; }
  .f-up { --fl: rgba(8, 153, 129, .45); } .f-down { --fl: rgba(242, 54, 69, .45); } .f-same { --fl: rgba(41, 98, 255, .35); }
  @keyframes flash { 0% { background: var(--fl); } 100% { background: transparent; } }
  .empty { padding: 32px 20px; color: var(--muted); text-align: center; }

  /* Dock: every list with its sentiment %, then add / sort / lists */
  .dock { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg2); border-top: 1px solid var(--line); }
  .chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 66px; padding: 6px 12px; border-radius: 12px;
    background: var(--bg3); border: 1px solid transparent; text-align: left; }
  .chip b { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chip small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip small.up { color: var(--up); } .chip small.down { color: var(--down); }
  .chip.on { border-color: var(--accent); background: var(--accent-bg); }
  .acts { flex: none; display: flex; gap: 6px; padding-left: 8px; border-left: 1px solid var(--line); }
  .ib { width: 44px; height: 44px; border-radius: 12px; background: var(--bg3); display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0; }
  .ib svg { width: 20px; height: 20px; }
  .ib.primary { background: var(--accent); color: #fff; }
  .ib.on { background: var(--accent-bg); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  /* Chart pane */
  .chartpane { position: relative; }
  #tv_chart { position: relative; flex: 1; min-height: 0; }
  .cbar { position: relative; flex-shrink: 0; display: flex; gap: 8px; padding: 8px 10px; background: var(--bg2); }
  .sbtn { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12px; background: var(--bg3); color: var(--muted); }
  .sbtn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sbtn b { color: var(--text); font-weight: 600; }
  /* Interval: segmented control. Phones: under the chart (thumb side). Desktop: on top of the chart. */
  .ctools { order: 2; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg2); border-top: 1px solid var(--line); }
  .seg { display: flex; gap: 4px; padding: 8px 10px 0; }
  .seg button { flex: 1; height: 36px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--muted); background: var(--bg3); font-variant-numeric: tabular-nums; }
  .seg button.on { color: #fff; background: var(--accent); }
  #tv_chart { order: 1; }
  .infobtn { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--bg3); display: flex; align-items: center; justify-content: center; }
  .infobtn svg { width: 20px; height: 20px; }
  body.details-open .infobtn { background: var(--accent-bg); color: var(--accent); }

  /* Bottom nav (phones) */
  .nav { position: relative; flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); border-top: 1px solid var(--line);
    padding-bottom: max(0px, calc(var(--safe-b) - 12px)); }
  body.ios-gap .nav { padding-bottom: 0; }
  .nav button { height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: var(--muted); }
  .nav button svg { width: 21px; height: 21px; }
  .nav button.on { color: var(--text); } .nav button.on svg { color: var(--accent); }
  .nav .ver { position: absolute; right: 8px; bottom: 4px; font-size: 9px; color: var(--muted); opacity: .7; pointer-events: none; }

  /* Sheets: bottom sheet on phones, centered dialog on desktop */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); }
  .sheet { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 51; max-height: calc(88% - var(--kb, 0px)); display: flex; flex-direction: column;
    background: var(--bg2); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .5); padding-bottom: max(8px, var(--safe-b)); }
  body.kb .sheet { padding-bottom: 8px; }
  .sheet::before { content: ''; flex-shrink: 0; width: 36px; height: 4px; border-radius: 2px; background: var(--bg3); margin: 10px auto 4px; }
  .sh-title { flex-shrink: 0; padding: 4px 16px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .sh-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  .sh-foot { flex-shrink: 0; padding: 8px 12px 0; }
  .sh-foot button { width: 100%; height: 46px; border-radius: 12px; background: var(--bg3); font-weight: 600; }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 16px; border-top: 1px solid var(--line); text-align: left; font-size: 16px; flex-shrink: 0; }
  .opt .c { margin-left: auto; font-size: 12px; color: var(--muted); }
  .opt.on { color: var(--accent); } .opt.danger { color: var(--down); }
  /* search */
  .sres { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 9px 12px 9px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .sr .s { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .sr .s b { font-weight: 600; }
  .sr .s small { font-size: 11px; color: var(--muted); }
  .sr .d { grid-column: 1; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr .add { grid-column: 2; grid-row: 1 / span 2; width: 40px; height: 40px; border-radius: 10px; background: var(--bg3); display: flex; align-items: center; justify-content: center; }
  .sr .add svg { width: 18px; height: 18px; }
  .sr .add.in { background: none; color: var(--up); }
  .shint { padding: 18px 16px; color: var(--muted); font-size: 14px; }
  .sform { flex-shrink: 0; padding: 10px 12px 2px; }
  .field { width: 100%; height: 44px; padding: 0 12px; font-size: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .field:focus { border-color: var(--accent); }
  /* list manager */
  .lm { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .lm .field { flex: 1; min-width: 0; height: 40px; }
  .lm .ib { width: 40px; height: 40px; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .lm .ib.sig.on { color: var(--accent); background: var(--accent-bg); }
  .lm .ib.del.armed { width: auto; padding: 0 10px; background: var(--down); color: #fff; }
  .lm .ib:disabled { opacity: .35; }
  .lmnew { display: flex; gap: 8px; padding: 10px 12px 2px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .lmnew button { flex: none; padding: 0 16px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
  /* Sync across devices (inside the list manager) */
  .sync { flex-shrink: 0; margin-top: 10px; padding: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .sync h4 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .sync h4 i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .sync h4 i.ok { background: var(--up); } .sync h4 i.err { background: var(--down); } .sync h4 i.busy { background: var(--pre); }
  .sync h4 span { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted); }
  .sync p { margin: 0; font-size: 13px; color: var(--muted); }
  .sync .row2 { display: flex; gap: 8px; }
  .sync .row2 .field { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .08em; }
  .sync .btn { flex: none; height: 44px; padding: 0 16px; border-radius: 10px; background: var(--bg3); font-weight: 600; }
  .sync .btn.primary { background: var(--accent); color: #fff; }
  .sync .btn.link { height: auto; padding: 0; background: none; color: var(--muted); font-weight: 400; font-size: 13px; text-align: left; }
  .sync .code { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--bg);
    font: 600 18px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; user-select: all; -webkit-user-select: all; }
  .sync .msg { font-size: 12px; color: var(--down); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 80px + var(--safe-b)); z-index: 60; display: flex; align-items: center; gap: 14px;
    max-width: calc(100vw - 24px); padding: 11px 16px; border-radius: 10px; background: var(--bg3); font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast button { color: var(--accent); font-weight: 600; flex-shrink: 0; }
  /* Sentiment chart (desktop): the active list's sentiment % over time, above the table */
  .sent { display: none; }
  .sent-h { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .sent-h b { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .sent-h .rng { margin-left: auto; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--bg3); font-size: 11px; font-weight: 600; color: var(--text); }
  .sent-c { position: relative; margin-top: 4px; }
  .sent svg { width: 100%; height: 58px; overflow: visible; }
  .sent .zero { stroke: var(--muted); stroke-opacity: .45; stroke-dasharray: 3 3; }
  .sent .line { fill: none; stroke-width: 1.6; }
  .sent .area { opacity: .16; }
  .sent .up { stroke: var(--up); fill: var(--up); } .sent .down { stroke: var(--down); fill: var(--down); }
  .sent .lbl { font-size: 10px; fill: var(--muted); }
  .sent .dot { fill: var(--text); stroke: var(--bg); stroke-width: 1.5; }
  .sent .tip { position: absolute; top: -4px; transform: translate(-50%, -100%); padding: 3px 7px; border-radius: 5px; background: var(--bg3);
    font-size: 11px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
  .sent .none { height: 58px; display: flex; align-items: center; font-size: 12px; color: var(--muted); }
  /* Details: a bottom sheet on phones (rendered into the sheet), a column between list and chart on desktop */
  .detailspane { display: none; }
  .dt-head { padding: 2px 16px 12px; }
  .dt-head .dsc { font-size: 13px; color: var(--muted); }
  .dt-px { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .dt-px b { font-size: 26px; font-weight: 600; }
  .dt-px span { font-size: 15px; }
  .dt-px small { font-size: 12px; color: var(--muted); }
  .dt-ext { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dt-sec { padding: 10px 16px 12px; border-top: 1px solid var(--line); flex-shrink: 0; }
  .dt-sec h4 { margin: 0 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .kv > span:first-child { color: var(--muted); white-space: nowrap; }
  .kv > span:last-child { text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv small { font-size: 12px; margin-left: 4px; }
  .rb { margin: 6px 0 8px; }
  .rbt { position: relative; height: 4px; border-radius: 2px; background: var(--bg3); }
  .rbt i { position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--text); transform: translateX(-50%); }
  .rbl { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dt-empty { padding: 16px; color: var(--muted); }
  #feeders { position: fixed; left: -2000px; top: 0; width: 320px; pointer-events: none; }
  #feeders > div { width: 320px; height: 220px; }

  /* ---------- Desktop / tablet ---------- */
  @media (min-width: 768px) {
    html, body { font-size: 14px; }
    .top { height: 50px; gap: 16px; }
    .hl, .hs, body[data-view] .hl, body[data-view] .hs { display: flex; }
    .hs { padding-left: 16px; border-left: 1px solid var(--line); cursor: pointer; }
    .hbtn, .hver { display: flex; }
    .nav { display: none; }
    body[data-view] .pane { display: flex; }
    .listpane { flex: none; width: 420px; border-right: 1px solid var(--line); }
    body.chart-hidden .chartpane { display: none; }
    body[data-view] .detailspane { display: none; }
    .sent { display: block; flex-shrink: 0; padding: 8px 14px 6px; border-bottom: 1px solid var(--line); background: var(--bg); }
    body.details-open[data-view] .detailspane { display: flex; flex: none; width: 300px; border-right: 1px solid var(--line); background: var(--bg); }
    .detailspane .dt-top { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 4px 16px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .detailspane .dt-top button { width: 28px; height: 28px; border-radius: 6px; color: var(--muted); }
    .detailspane .dt-top button:hover { background: var(--bg3); color: var(--text); }

<script>

}
const SYMBOL_FIXES = { 'CAPITALCOM:US100': 'SKILLING:US100', 'CAPITALCOM:SPX500': 'SKILLING:SPX500', 'TVC:DJI': 'DJ:DJI', 'TVC:UKOIL': 'FX:UKOIL',
  'OANDA:XAGUSD': 'TVC:SILVER', 'AMEX:LEU': 'NYSE:LEU', 'NASDAQ:EUV': 'CBOE:EUV', 'NASDAQ:DXYZ': 'NYSE:DXYZ',
  'NASDAQ:NASA': 'AMEX:NASA', 'NASDAQ:TE': 'NYSE:TE', 'NYSE:QS': 'NASDAQ:QS' };
const REMOVED = new Set(['NASDAQ:NDX', 'SP:SPX']);   // no chart in the free widget
// The free widget has no chart for plain indices and BIST; these stay quote-only.
const noChart = sym => /^(TVC:VIX|NASDAQ:NDX|SP:SPX|INDEX:|BIST:)/.test(sym);

// TVC:US10Y (US 10Y yield) spins forever in the embed; PYTH:US10Y carries the same yield and charts.
const CHART_ALIAS = { 'TVC:US10Y': 'PYTH:US10Y' };
const chartSymbol = sym => CHART_ALIAS[sym] || sym;
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.lists) && s.lists.length) {
      const fix = x => SYMBOL_FIXES[x] || x;
      s.symbol = fix(s.symbol);
      s.lists.forEach(l => l.groups.forEach(g => { g.symbols = g.symbols.map(fix).filter(x => !REMOVED.has(x)); }));
      s.lists.forEach(l => { if (l.summary === undefined) l.summary = l.id === 'tr' ? 'BIST:XU100' : ['abd', 'inci', 'zorning', 'krip'].includes(l.id); });
      // One-time edits to stored lists (each runs once per device, so later manual changes stick).
      s.migrated = Array.isArray(s.migrated) ? s.migrated : [];
      if (!s.migrated.includes('abd-index-trim')) {
        const drop = new Set(['CME_MINI:NQ1!', 'CME_MINI:ES1!', 'CBOT_MINI:YM1!', 'OKX:US100USDT.P', 'OKX:US500USDT.P']);
        s.lists.filter(l => l.id === 'abd').forEach(l => l.groups.forEach(g => { g.symbols = g.symbols.filter(x => !drop.has(x)); }));
        s.migrated.push('abd-index-trim');
      }
      // Leftovers from the previous design (pinned tape, details panel, history chart, edit mode).
      for (const k of ['pinned', 'hudHidden', 'histRange', 'panelWidth', 'mview']) delete s[k];

}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
  syncNoteChange();
}

// ================= Sync across devices =================
// The lists (names, groups, symbols, sentiment flag, order) live under a 12-character sync code in the relay worker's KV
// (GET/PUT /state/<code>). Per-device things stay local: active list, symbol, view, interval, collapsed groups.
// Last edit wins: every local edit stamps state.sync.updatedAt; the worker refuses a PUT older than what it holds (409).
var syncTimer = null, syncStatus = { st: 'idle', at: 0, msg: '' }, syncLast = null;
const SYNC_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const syncApi = () => (new URLSearchParams(location.search).get('sync_api') || RELAY_WS.replace(/^wss:/, 'https:').replace(/\/$/, '')) + '/state/';
const syncShape = lists => lists.map(l => ({ id: l.id, name: l.name, summary: l.summary, groups: l.groups.map(g => ({ name: g.name, symbols: g.symbols })) }));
const syncJson = () => JSON.stringify(syncShape(state.lists));
const fmtCode = c => c.replace(/(.{4})(?=.)/g, '$1-');
function newSyncCode() { const b = crypto.getRandomValues(new Uint8Array(12)); return [...b].map(x => SYNC_ALPHA[x & 31]).join(''); }
function parseSyncCode(t) { const c = String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return c.length === 12 && [...c].every(ch => SYNC_ALPHA.includes(ch)) ? c : null; }
function setSyncStatus(st, msg = '') { syncStatus = { st, at: st === 'ok' ? Date.now() : syncStatus.at, msg }; if (typeof sheetKind !== 'undefined' && sheetKind === 'lists') renderSyncBox(); }
// Called from save(): a change in the synced shape stamps the edit time and schedules a push.
function syncNoteChange() {
  const j = syncJson();
  if (syncLast === null) { syncLast = j; return; }
  if (j === syncLast) return;
  syncLast = j;
  state.sync = state.sync || {};
  state.sync.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
  if (state.sync.code) { clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 1500); }
}
async function syncPush() {
  const code = state.sync?.code; if (!code) return;
  setSyncStatus('busy');
  try {
    const r = await fetch(syncApi() + code, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updatedAt: state.sync.updatedAt || Date.now(), lists: syncShape(state.lists) }) });
    if (r.status === 409) { syncAdopt(await r.json()); return setSyncStatus('ok'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('err', 'Couldn\'t reach the sync service. Retrying on the next change.'); }
}
// join: the synced copy replaces this device's lists whatever their age.
async function syncPull(join = false) {
  const code = state.sync?.code; if (!code || (!join && (press || document.hidden))) return;
  setSyncStatus('busy');
  try {
    const r = await fetch(syncApi() + code, { cache: 'no-store' });
    if (r.status === 404) { if (join) { setSyncStatus('err', 'No lists are stored under this code yet.'); return false; } return syncPush(); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const remote = await r.json(), local = state.sync.updatedAt || 0;
    if (join || remote.updatedAt > local) syncAdopt(remote);
    else if (remote.updatedAt < local) return syncPush();

    return true;
  } catch (e) { setSyncStatus('err', 'Couldn\'t reach the sync service.'); return false; }
}
function syncAdopt(remote) {
  if (!remote || !Array.isArray(remote.lists) || !remote.lists.length) return;
  const collapsed = new Set(state.lists.flatMap(l => l.groups.filter(g => g.collapsed).map(g => l.id + '|' + g.name)));
  state.lists = remote.lists.map(l => ({ ...l, groups: l.groups.map(g => ({ name: g.name, symbols: g.symbols, collapsed: collapsed.has(l.id + '|' + g.name) })) }));
  if (!state.lists.some(l => l.id === state.activeListId)) state.activeListId = state.lists[0].id;
  state.sync.updatedAt = remote.updatedAt;
  syncLast = syncJson();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
  if (typeof render === 'function' && document.getElementById('rows')) {
    if (['row', 'move', 'copy'].includes(sheetKind)) closeSheet();
    render(); wsSync();
    if (sheetKind === 'lists') renderListManager();
  }
}
try { localStorage.removeItem('tvwl.eod.v1'); } catch (_) {}
const activeList = () => state.lists.find(l => l.id === state.activeListId) || state.lists[0];
const flatSymbols = list => list.groups.flatMap(g => g.symbols);
const allSymbols = () => [...new Set(state.lists.flatMap(flatSymbols))];

// ================= Formatting =================
const NF2 = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
// Prices: 2 decimals from 1 up; market-cap style T/B above a billion; four significant digits below 1 (0.0005436, 0.03020).
function fmtPrice(p) {
  if (p == null || isNaN(p)) return '';
  const a = Math.abs(p);
  if (a >= 1e12) return (p / 1e12).toFixed(2) + 'T';
  if (a >= 1e9) return (p / 1e9).toFixed(2) + 'B';
  if (a >= 1 || a === 0) return NF2.format(p);
  return p.toFixed(Math.min(10, 3 - Math.floor(Math.log10(a))));
}
const pct = v => v == null ? '' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const dir = v => v > 0 ? 'up' : v < 0 ? 'down' : '';

// ================= Sessions (New York) =================
const nyParts = () => {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit' }).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return { wd: g('weekday'), m: (+g('hour') % 24) * 60 + +g('minute') };
};
// Regular session Mon–Fri 09:30–16:00: the Ext column is hidden then.
function isRegularSession() { const { wd, m } = nyParts(); return !['Sat', 'Sun'].includes(wd) && m >= 570 && m < 960; }
// pre 04:00–09:30, open 09:30–16:00, post 16:00–20:00, overnight 20:00–04:00 (Sun 20:00 → Fri 20:00), closed otherwise.
function sessionPhase() {
  const { wd, m } = nyParts();
  if (wd === 'Sat' || (wd === 'Sun' && m < 1200) || (wd === 'Fri' && m >= 1200)) return ['closed', 'Closed'];
  if (m < 240 || m >= 1200) return ['night', 'Overnight'];
  if (m < 570) return ['pre', 'Pre-market'];
  if (m < 960) return ['open', 'Market open'];
  return ['post', 'Post-market'];
}
let regular = isRegularSession(), lastPhase = null;
function renderSession() {
  const [cls, label] = sessionPhase();
  if (lastPhase && lastPhase !== cls && (lastPhase === 'night' || cls === 'night')) {
    wsSync();
    if (cls !== 'night') Object.keys(raw).filter(k => k.startsWith('BOATS:')).forEach(k => delete raw[k]);   // stale overnight prints
    for (const k of Object.keys(raw)) if (!k.startsWith('BOATS:')) onQuote(k, {});
  }
  lastPhase = cls;
  document.body.className = document.body.className.replace(/\bsess-\w+\b/g, '').replace(/\s+/g, ' ').trim() + ' sess-' + cls;
  $('sessLabel').textContent = label;
  regular = isRegularSession();
  document.body.classList.toggle('regular', regular);
}

// ================= Sentiment % =================
// A list's sentiment % is the average move of its summary symbols: equities only (indices, CFDs, futures excluded),
// Krip only USDT pairs; TR uses BIST:XU100 itself (summary is a symbol string). summary false → no sentiment.
const NON_EQUITY = new Set(['index', 'cfd', 'futures', 'economic']);
const SUMMARY_MATCH = { krip: /USDT$/ };
const effChange = q => q ? (!regular && q.e != null ? q.e : q.c) : null;   // outside regular hours the extended move counts
const summarySymbols = list => flatSymbols(list).filter(sy => SUMMARY_MATCH[list.id] ? SUMMARY_MATCH[list.id].test(sy) : !NON_EQUITY.has(raw[sy]?.type));
function listValue(l) {
  if (!l.summary) return null;
  if (typeof l.summary === 'string') return effChange(quotes[l.summary]);
  const v = summarySymbols(l).map(sy => effChange(quotes[sy])).filter(x => x != null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}

// ================= Sentiment history (desktop chart) =================
// One sample per list every 15 s while the app is open; the last 2 h at full rate, older samples thinned to 1/min, 24 h kept.
const HIST_KEY = 'tvwl.hist.v1', HIST_MS = 15000, HIST_FINE_MS = 2 * 3600000, HIST_COARSE_MS = 60000, HIST_MAX_MS = 24 * 3600000;
let hist = {}; try { hist = JSON.parse(localStorage.getItem(HIST_KEY)) || {}; } catch (_) {}
function pruneHistory(arr, now) {
  const out = []; let lastCoarse = 0;
  for (const x of arr) {
    if (now - x[0] > HIST_MAX_MS) continue;
    if (now - x[0] > HIST_FINE_MS) { if (x[0] - lastCoarse < HIST_COARSE_MS - 1000) continue; lastCoarse = x[0]; }
    out.push(x);
  }
  return out;
}
function sampleHistory() {
  const now = Date.now(); let changed = false;
  for (const l of state.lists) {
    const v = listValue(l); if (v == null) continue;
    const arr = hist[l.id] || [];
    if (arr.length && now - arr[arr.length - 1][0] < HIST_MS - 1000) continue;
    arr.push([now, +v.toFixed(3)]);
    hist[l.id] = pruneHistory(arr, now); changed = true;
  }
  if (changed) { try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch (_) {} }
}

      filter2: { operator: 'or', operands: [{ expression: { left: 'name', operation: 'match', right: text } }, { expression: { left: 'description', operation: 'match', right: text } }] },
      columns: ['name', 'exchange', 'description', 'type'], sort: { sortBy: 'market_cap_basic', sortOrder: 'desc', nullsFirst: false }, range: [0, 15] };

  if (act === 'on') {
    const c = newSyncCode();
    state.sync = { ...(state.sync || {}), code: c, lastCode: c, updatedAt: state.sync?.updatedAt || Date.now() }; save();
    await syncPush(); renderSyncBox();
  }
  if (act === 'copy') {
    const code = fmtCode(state.sync.code || state.sync.lastCode);
    try { await navigator.clipboard.writeText(code); toast('Code copied'); } catch (_) { toast(code); }
  }
  if (act === 'off') { state.sync.lastCode = state.sync.code; state.sync.code = null; save(); setSyncStatus('idle'); renderSyncBox(); toast('Sync is off on this device. Your lists stay here.'); }
  if (act === 'resume') { state.sync.code = state.sync.lastCode; save(); await syncPull(); renderSyncBox(); }
});

let toastTimer = null;
function toast(text, action, fn) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(text)}</span>${action ? `<button>${esc(action)}</button>` : ''}`;
  if (action) t.querySelector('button').addEventListener('click', () => { t.remove(); fn(); });
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4000);
}

// ================= Clicks =================
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  switch (el.dataset.act) {
    case 'list': state.activeListId = el.dataset.id; save(); render(); $('rows').scrollTop = 0; break;
    case 'view': setView(el.dataset.view); break;
    case 'search': openSearch(); break;
    case 'sort': state.sort = state.sort === 'chg' ? null : 'chg'; save(); render(); break;
    case 'lists': openListManager(); break;
    case 'reconnect': refreshQuotes(); break;
    case 'details': toggleDetails(); break;
    case 'hist-range': state.histRange = HIST_RANGES[(HIST_RANGES.indexOf(histRange()) + 1) % HIST_RANGES.length]; save(); renderSentiment(); break;
    case 'toggle-chart': state.chartHidden = !state.chartHidden; save(); applyChartHidden(); break;
    case 'sheet-close': closeSheet(); break;
    case 'group': { const g = activeList().groups[+el.dataset.g]; if (g) { g.collapsed = !g.collapsed; save(); renderRows(); } break; }
    case 'row-menu': { e.stopPropagation(); const r = el.closest('.row'); openRowMenu(r.dataset.sym, +r.dataset.g); break; }
  }
});

// ================= Row gestures =================
// Tap → chart. Press and hold (420 ms) → the row lifts: release in place for its actions, or drag it (touch or mouse)
// to reorder, across groups too. Right-click also opens the actions on desktop.
const rowsEl = $('rows');
let press = null, suppressClick = false;
rowsEl.addEventListener('pointerdown', e => {
  if (e.button > 0 || e.target.closest('.more')) return;
  const row = e.target.closest('.row'); if (!row) return;
  press = { row, id: e.pointerId, type: e.pointerType, x: e.clientX, y: e.clientY, armed: false, drag: false, pos: null,
    timer: setTimeout(() => { if (!press) return; press.armed = true; press.row.classList.add('lift'); navigator.vibrate?.(8); }, 420) };
});
rowsEl.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const dist = Math.hypot(e.clientX - press.x, e.clientY - press.y);
  if (!press.armed) { if (dist > 8) { clearTimeout(press.timer); press = null; } return; }
  if (!press.drag) {
    if (dist < 6 || state.sort) return;
    press.drag = true; press.row.classList.add('dragging');
    try { rowsEl.setPointerCapture(e.pointerId); } catch (_) {}
  }
  updateDrop(e.clientY);
  const r = rowsEl.getBoundingClientRect();
  if (e.clientY < r.top + 44) rowsEl.scrollTop -= 10; else if (e.clientY > r.bottom - 44) rowsEl.scrollTop += 10;
});
// Once a row is lifted the finger must not scroll the list.
rowsEl.addEventListener('touchmove', e => { if (press && press.armed) e.preventDefault(); }, { passive: false });
function clearDrop() { rowsEl.querySelectorAll('.drop-before, .drop-after, .drop-into').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-into')); }
function updateDrop(y) {
  clearDrop();
  let target = null, after = false;
  for (const it of rowsEl.querySelectorAll('.row:not(.dragging), .gh[data-g]')) {
    const r = it.getBoundingClientRect();
    if (y < r.top + r.height / 2) { target = it; after = false; break; }
    target = it; after = true;
  }
  if (!target) { press.pos = null; return; }
  if (target.classList.contains('gh')) { target.classList.add('drop-into'); press.pos = { g: +target.dataset.g, index: 0 }; return; }
  target.classList.add(after ? 'drop-after' : 'drop-before');
  const g = activeList().groups[+target.dataset.g], i = g.symbols.indexOf(target.dataset.sym);
  press.pos = { g: +target.dataset.g, index: i + (after ? 1 : 0) };
}
function endPress(cancel) {
  if (!press) return;
  clearTimeout(press.timer);
  const p = press; press = null;
  p.row.classList.remove('lift', 'dragging'); clearDrop();
  if (!p.armed || cancel) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 400);
  if (p.drag) {
    if (!p.pos) return;
    const sym = p.row.dataset.sym, from = +p.row.dataset.g, src = activeList().groups[from];
    let index = p.pos.index;
    if (from === p.pos.g && src.symbols.indexOf(sym) < index) index--;   // removing it first shifts the slot up
    moveSymbol(sym, from, p.pos.g, index);
  } else openRowMenu(p.row.dataset.sym, +p.row.dataset.g);
}
rowsEl.addEventListener('pointerup', () => endPress(false));
rowsEl.addEventListener('pointercancel', () => endPress(true));
rowsEl.addEventListener('click', e => {
  if (suppressClick) { e.stopPropagation(); return; }
  if (e.target.closest('[data-act]')) return;
  const row = e.target.closest('.row'); if (row) selectSymbol(row.dataset.sym);
});
rowsEl.addEventListener('contextmenu', e => {
  const row = e.target.closest('.row'); if (!row) return;
  e.preventDefault();
  if (!press || press.type === 'mouse') { if (press) endPress(true); openRowMenu(row.dataset.sym, +row.dataset.g); }
});

// ================= iOS niceties =================
// Focusing an input inside the fixed body scrolls the document on iOS; afterwards taps land off target. Snap back.
function unshift() { if (window.scrollY || document.documentElement.scrollTop) window.scrollTo(0, 0); }
document.addEventListener('focusout', () => setTimeout(unshift, 60));
// Keep bottom sheets above the on-screen keyboard.
function trackKeyboard() {
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb', kb > 60 && isPhone() ? kb + 'px' : '0px');
  document.body.classList.toggle('kb', kb > 60);
  setTimeout(unshift, 60);
}
window.visualViewport?.addEventListener('resize', trackKeyboard);
// Home-screen app: when iOS leaves a gap under the web view, the nav needs no home-indicator padding.
function fitStandalone() {
  if (!matchMedia('(display-mode: standalone)').matches && !navigator.standalone) return;
  const portrait = matchMedia('(orientation: portrait)').matches;
  const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const gap = Math.round(full - window.innerHeight);
  document.body.classList.toggle('ios-gap', gap > 0 && gap <= 100);
}
fitStandalone();
window.addEventListener('resize', fitStandalone);
// A widget mounted while its pane had no size stays blank: remount it once the pane is actually on screen.
window.addEventListener('resize', () => { if (chart.hiddenAtMount && $('chartWrap').offsetWidth > 0) { mountChart(); showSymbol(); } });

// ================= Boot =================
state.histRange = 'session';   // the sentiment chart always opens on the current session
setInterval(sampleHistory, HIST_MS);
window.addEventListener('resize', () => { clearTimeout(window._sentT); window._sentT = setTimeout(renderSentiment, 150); });
$('ver').textContent = $('hver').textContent = 'v' + APP_VERSION;
renderSession();
setInterval(renderSession, 30000);
render();
applyChartHidden();
applyDetails();
window.addEventListener('resize', () => { if (document.body.classList.contains('details-open') !== (!!state.detailsOpen && !isPhone())) applyDetails(); });
setView(isPhone() ? state.view : 'list');
mountChart();
wsConnect();
syncLast = syncJson();
{ const m = location.hash.match(/sync=([A-Za-z0-9-]+)/); const c = m && parseSyncCode(m[1]);
  if (c) { history.replaceState(null, '', location.pathname + location.search);
    if (state.sync?.code !== c) { pendingSyncCode = fmtCode(c); setTimeout(openListManager, 300); } } }
syncPull();
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPull(); });
setInterval(() => { if (!document.hidden) syncPull(); }, 60000);

// Prod: GitHub Pages caches for 10 min and the PWA holds on to old pages; reload when a newer version is live.
const IS_LAN = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
const IS_DEV = IS_LOCAL || IS_LAN;
if (!IS_DEV) {
  const check = async () => {
    try {
      const r = await fetch(location.pathname, { cache: 'no-store' });
      const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    } catch (_) {}
  };
  setTimeout(check, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
}
// Dev: live reload on localhost / LAN when the file changes.
if (IS_DEV) (async () => {
  const stamp = async () => { try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }); return r.headers.get('last-modified') || r.headers.get('etag'); } catch (_) { return null; } };
  let last = await stamp();
  setInterval(async () => { const now = await stamp(); if (now && last && now !== last) location.reload(); if (now) last = now; }, 1000);
})();
</script>
