<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist</title>
<style>
  :root {
    --bg: #131722; --bg2: #1e222d; --bg3: #2a2e39; --border: #2a2e39;
    --text: #d1d4dc; --muted: #787b86; --accent: #2962ff; --accent-bg: #1c2a52;
    --up: #089981; --down: #f23645;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }

  .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; min-width: 0;
    border-bottom: 1px solid var(--border); background: var(--bg2); }
  .tabs { flex: 0 1 auto; }
  /* US session as the top bar's background tint */
  body.sess-open .bar { background: rgba(8, 153, 129, .16); }
  body.sess-pre .bar { background: rgba(247, 166, 0, .16); }
  body.sess-post .bar { background: rgba(79, 140, 255, .16); }
  body.sess-night .bar { background: rgba(176, 108, 255, .16); }
  body.sess-closed .bar { background: var(--bg2); }
  #chartToggle svg { display: block; }
  #chartToggle .i-show, #chartToggle.off .i-hide { display: none; }
  #chartToggle.off .i-show { display: block; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 5px 12px; border-radius: 6px; color: var(--muted); white-space: nowrap; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .badge:empty { display: none; }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .badge.up i { background: var(--up); } .badge.down i { background: var(--down); }
  .badge.up { color: var(--up); } .badge.down { color: var(--down); }
  .tab:hover { background: var(--bg3); color: var(--text); }
  .tab.on { background: var(--bg3); color: #fff; }
  .icon { width: 28px; height: 28px; border-radius: 6px; display: inline-flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 15px; }
  .icon:hover { background: var(--bg3); color: var(--text); }
  .spacer { flex: 1; }
  .upd { white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--muted); padding: 4px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .upd:hover { background: var(--bg3); color: var(--text); }
  .upd.err { color: var(--down); }
  .status { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .status.live { background: var(--up); }
  .status.off { background: var(--down); }
  .status.poll { background: #f7a600; }
  .upd.pulse { animation: pulse .6s ease-out; }
  @keyframes pulse { 0% { color: var(--text); background: var(--accent-bg); } 100% { color: var(--muted); background: transparent; } }
  dialog { background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 0; width: min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
    border-bottom: 1px solid var(--border); font-weight: 600; }
  .dlg-row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; }
  .dlg-row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  .dlg-row .count { color: var(--muted); font-size: 11px; width: 48px; text-align: right; }
  .dlg-row .sum { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .dlg-row .sum input { accent-color: var(--accent); margin: 0; }
  .dlg-row .icon { color: var(--muted); }
  .dlg-row .icon:hover { color: var(--down); }
  .dlg-row .move { font-size: 11px; width: 22px; }
  .dlg-add { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .dlg-add input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  .dlg-add button { background: var(--accent); color: #fff; border-radius: 6px; padding: 0 12px; }
  .toggle { display: none; }
  body.chart-hidden .chart, body.chart-hidden .resizer { display: none; }
  body.chart-hidden .panel { width: auto !important; flex: 1; max-height: none; border-bottom: 0; }

  .body { display: flex; flex: 1; min-height: 0; }
  .panel { width: 300px; flex-shrink: 0; background: var(--bg);
    display: flex; flex-direction: column; min-height: 0; }
  .list { flex: 1; overflow-y: auto; }
  .grp { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; color: var(--text); background: var(--bg2); cursor: pointer; user-select: none; }
  .grp .chev { color: var(--muted); font-size: 10px; }
  .grp .name { flex: 1; }
  .breadth { display: flex; align-items: center; gap: 12px; padding: 5px 10px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .breadth:empty { display: none; }
  .breadth .meter { flex: 1; min-width: 0; height: 6px; display: grid; border-radius: 3px; overflow: hidden; background: var(--bg3); }
  .breadth .meter .t-d4 { background: rgba(242, 54, 69, 1); }   .breadth .meter .t-d3 { background: rgba(242, 54, 69, .72); }
  .breadth .meter .t-d2 { background: rgba(242, 54, 69, .48); } .breadth .meter .t-d1 { background: rgba(242, 54, 69, .28); }
  .breadth .meter .t-0 { background: var(--bg3); }
  .breadth .meter .t-u1 { background: rgba(8, 153, 129, .28); } .breadth .meter .t-u2 { background: rgba(8, 153, 129, .48); }
  .breadth .meter .t-u3 { background: rgba(8, 153, 129, .72); } .breadth .meter .t-u4 { background: rgba(8, 153, 129, 1); }
  .breadth .stat { white-space: nowrap; flex-shrink: 0; }
  .breadth .stat b { font-weight: 600; color: var(--text); }
  .breadth .stat .up { color: var(--up); } .breadth .stat .down { color: var(--down); }
  .grp .chev { display: inline-block; transition: transform .15s; }
  .grp.collapsed .chev { transform: rotate(-90deg); }
  .grp .icon { width: 22px; height: 22px; font-size: 12px; opacity: 0; }
  .grp:hover .icon { opacity: 1; }
  .taperow { display: flex; align-items: center; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .tape { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 3px 8px; overflow-x: auto; scrollbar-width: none;
    font-variant-numeric: tabular-nums; }
  .ivsel { flex-shrink: 0; margin: 0 8px 0 4px; background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 6px; font-size: 12px; font-weight: 500; }
  .tape::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 7px; border-radius: 6px;
    white-space: nowrap; color: var(--text); flex-shrink: 0; line-height: 1.1; }
  .chip:hover { background: var(--bg3); }
  .chip.on { box-shadow: inset 0 0 0 1px var(--accent); }
  .chip.s-up-1 { background: rgba(8, 153, 129, .12); }
  .chip.s-up-2 { background: rgba(8, 153, 129, .24); }
  .chip.s-up-3 { background: rgba(8, 153, 129, .40); }
  .chip.s-up-4 { background: rgba(8, 153, 129, .60); }
  .chip.s-down-1 { background: rgba(242, 54, 69, .12); }
  .chip.s-down-2 { background: rgba(242, 54, 69, .24); }
  .chip.s-down-3 { background: rgba(242, 54, 69, .40); }
  .chip.s-down-4 { background: rgba(242, 54, 69, .60); }
  .chip[class*="s-up-"] .px, .chip[class*="s-up-"] .chg, .chip[class*="s-down-"] .px, .chip[class*="s-down-"] .chg { color: var(--text); }
  .row.s-up-1 { background: rgba(8, 153, 129, .08); }
  .row.s-up-2 { background: rgba(8, 153, 129, .17); }
  .row.s-up-3 { background: rgba(8, 153, 129, .30); }
  .row.s-up-4 { background: rgba(8, 153, 129, .46); }
  .row.s-down-1 { background: rgba(242, 54, 69, .08); }
  .row.s-down-2 { background: rgba(242, 54, 69, .17); }
  .row.s-down-3 { background: rgba(242, 54, 69, .30); }
  .row.s-down-4 { background: rgba(242, 54, 69, .46); }
  .row.on[class*="s-"] { box-shadow: inset 0 0 0 1px var(--accent); }
  .chip .sym { font-weight: 600; font-size: 13px; color: var(--text); }
  .chip .sym small { font-weight: 400; font-size: 9px; color: var(--muted); margin-left: 3px; }
  .chip.nochart, .row.nochart { cursor: default; }
  .chip.nochart .sym, .row.nochart .sym { color: var(--muted); font-weight: 500; }
  .chip.nochart:hover, .row.nochart:hover { background: transparent; }
  .chip .q { display: flex; flex-direction: column; align-items: flex-end; }
  .chip .px { font-size: 12px; }
  .chip .chg { font-size: 10px; }
  .chip .ext, .chip .px:empty, .chip .chg:empty { display: none; }
  .chip .px.up, .chip .chg.up { color: var(--up); }
  .chip .px.down, .chip .chg.down { color: var(--down); }
  .chip .x { color: var(--muted); font-size: 13px; width: 0; overflow: hidden; transition: width .15s; }
  .chip:hover .x { width: 10px; }
  .cols { display: grid; grid-template-columns: 1fr 76px 60px 70px; gap: 6px; padding: 6px 10px; font-size: 12px;
    color: var(--muted); border-bottom: 1px solid var(--border); }
  .cols span:not(:first-child) { text-align: right; }
  .row { display: grid; grid-template-columns: 1fr 76px 60px 70px; gap: 6px; align-items: center; padding: 0 10px;
    height: 30px; cursor: pointer; font-size: 13px; font-variant-numeric: tabular-nums; position: relative;
    border-left: 2px solid transparent; }
  .row:hover { background: var(--bg2); }
  .row.on { background: var(--accent-bg); border-left-color: var(--accent); }
  .row .sym { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .q { display: contents; }
  .row .px, .row .chg, .row .ext { text-align: right; }
  .row .ext { font-size: 12px; display: flex; align-items: center; justify-content: flex-end; }
  .row .ext .v { min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
  .ss { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .ss.pre { background: #f7a600; }
  .ss.post { background: #4f8cff; }
  .ss.night { background: #b06cff; }
  .panel.no-ext .cols, .panel.no-ext .row { grid-template-columns: 1fr 76px 60px; }
  .panel.no-ext .cols span:last-child, .panel.no-ext .ext { display: none; }
  .row .px.up, .row .chg.up, .row .ext.up { color: var(--up); }
  .row .px.down, .row .chg.down, .row .ext.down { color: var(--down); }
  .row .px:empty::before, .row .chg:empty::before, .row .ext:empty::before { content: '–'; color: var(--muted); }
  .row.dragging { opacity: .4; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .gtab.drop-into { box-shadow: inset 0 0 0 1px var(--accent); }
  .group { border-top: 1px solid var(--border); }
  .gtab { position: relative; display: flex; align-items: center; gap: 6px; height: 18px; padding: 0 10px;
    background: var(--bg3); cursor: pointer; user-select: none; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text); }
  .gtab:hover { filter: brightness(1.2); }
  .gtab .chev { color: var(--muted); font-size: 9px; transition: transform .15s; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .gname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gtools { display: flex; gap: 2px; opacity: 0; }
  .gtab:hover .gtools { opacity: 1; }
  .gtools .icon { width: 16px; height: 16px; font-size: 11px; }
  .grows { flex: 1; min-width: 0; }
  .gcount { padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .flash { animation: cell .9s ease-out; border-radius: 3px; }
  .f-up { --fl: rgba(8, 153, 129, .45); }
  .f-down { --fl: rgba(242, 54, 69, .45); }
  .f-same { --fl: rgba(41, 98, 255, .35); }
  @keyframes cell { 0% { background: var(--fl); } 100% { background: transparent; } }
  .row .icon { width: 16px; height: 16px; font-size: 12px; opacity: 0; flex-shrink: 0; background: transparent; }
  .row:hover .icon { opacity: 1; }
  .row .icon:hover { background: var(--bg3); }
  .row .icon.info { font: italic 600 11px Georgia, serif; }
  .row .icon.rm { position: absolute; right: 2px; top: 7px; background: var(--bg3); }
  .row .sym { display: flex; align-items: center; gap: 4px; }
  .row .sym .name { overflow: hidden; text-overflow: ellipsis; }
  .earn { flex-shrink: 0; font-size: 9px; font-weight: 600; line-height: 1; padding: 2px 4px; border-radius: 3px;
    color: #f7a600; border: 1px solid rgba(247, 166, 0, .55); letter-spacing: .02em; }
  .earn.soon { background: #f7a600; color: #131722; border-color: #f7a600; }
  .row .icon.star.on { opacity: 1; color: #f7a600; background: transparent; }
  .empty { padding: 20px 12px; color: var(--muted); text-align: center; }

  .add { display: flex; gap: 4px; padding: 6px; border-top: 1px solid var(--border); }
  .add input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 6px; text-transform: uppercase; font-size: 12px; }
  .add button { background: var(--accent); color: #fff; border-radius: 6px; width: 28px; }

  .details { position: relative; display: none; width: 280px; flex-shrink: 0; overflow-y: auto; background: var(--bg);
    border-right: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  body.details-open .details { display: block; }
  .dclose { position: absolute; right: 8px; top: 8px; z-index: 1; }
  .d-head { padding: 12px 14px 10px; padding-right: 40px; border-bottom: 1px solid var(--border); }
  .d-sym { display: flex; align-items: baseline; gap: 8px; }
  .d-sym b { font-size: 18px; }
  .d-sym small { color: var(--muted); font-size: 12px; }
  .d-desc { color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d-price { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
  .d-price .big { font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
  .d-price .big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .d-price .up, .d-ext .up { color: var(--up); }
  .d-price .down, .d-ext .down { color: var(--down); }
  .d-sep { margin: 0 6px; color: var(--border); }
  .d-price span { font-size: 13px; }
  .d-ext { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .d-sec { padding: 8px 14px 10px; border-bottom: 1px solid var(--border); }
  .d-sec h4 { margin: 0 0 6px; font-size: 11px; font-weight: 500; color: var(--muted); }
  .d-kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 13px; }
  .d-kv span:first-child { color: var(--muted); }
  .d-bar { position: relative; height: 4px; background: var(--bg3); border-radius: 2px; margin: 8px 0 4px; }
  .d-bar i { transition: left .3s; position: absolute; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--text);
    transform: translateX(-50%); }
  .d-bar-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .d-empty { padding: 24px 14px; color: var(--muted); font-size: 13px; }
  .d-stale { color: var(--muted); font-size: 11px; margin-top: 6px; }
  #feeders { position: fixed; left: -2000px; top: 0; width: 320px; pointer-events: none; }
  #feeders > div { width: 320px; height: 220px; }
  .resizer { width: 5px; flex-shrink: 0; cursor: col-resize; background: var(--border); }
  .resizer:hover, .resizer.active { background: var(--accent); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .chart { pointer-events: none; }
  .chart { flex: 1; min-width: 0; position: relative; }
  #tv_chart { position: absolute; inset: 0; }

  @media (max-width: 768px) {
    .body { flex-direction: column; }
    .panel { width: auto !important; max-height: 40dvh; border-bottom: 1px solid var(--border); }
    .details { width: auto; max-height: 45dvh; border-right: 0; border-bottom: 1px solid var(--border); }
    .resizer { display: none; }
    .panel.hidden { display: none; }
    .toggle { display: inline-flex; }
    .bar { padding: 4px 8px; gap: 4px; }
    .tabs { flex: 1 1 auto; }
    .upd { font-size: 12px; padding: 4px 6px; }
    .chart { min-height: 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <button class="icon toggle" data-action="toggle-panel" title="Toggle list">☰</button>
  <div class="tabs" id="tabs"></div>
  <button class="icon" data-action="manage-lists" title="Manage lists">⋯</button>
  <span class="spacer"></span>
  <span class="status off" id="status"></span>
  <button class="upd" id="upd" data-action="refresh" title="Last tick. Click to reconnect.">–</button>
  <button class="icon" id="chartToggle" data-action="toggle-chart" title="Hide chart">
    <svg class="i-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
    <svg class="i-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</div>
<div class="taperow">
  <div class="tape" id="pins"></div>
  <select class="ivsel" id="intervals" title="Chart interval"></select>
</div>
<div class="breadth" id="summary" title="Breadth of the active list, indices excluded · session-aware change"></div>
<div id="feeders" aria-hidden="true"></div>
<div class="body">
  <div class="panel" id="panel">
    <div class="cols"><span>Symbol</span><span>Last</span><span>Chg%</span><span title="● pre-market · ● post-market · ● overnight">Ext</span></div>
    <div class="list" id="list"></div>
    <form class="add" id="addForm">
      <input id="symInput" placeholder="NASDAQ:NBIS" autocomplete="off" spellcheck="false">
      <button type="submit" title="Add symbol">+</button>
    </form>
  </div>
  <div class="resizer" id="resizer"></div>
  <aside class="details" id="details" aria-label="Symbol details">
    <button class="icon dclose" data-action="toggle-details" title="Close details">×</button>
    <div id="dbody"></div>
  </aside>
  <div class="chart" id="chartWrap"></div>
</div>

<dialog id="listDlg">
  <div class="dlg-head"><span>Watchlists</span><button class="icon" data-action="close-dlg" title="Close">×</button></div>
  <div id="dlgRows"></div>
  <form class="dlg-add" id="pinForm" title="Pinned symbols shown above every list, comma separated">
    <input id="pinInput" placeholder="Pinned: SKILLING:US100, BINANCE:BTCUSDT" autocomplete="off" spellcheck="false">
    <button type="submit">Pin</button>
  </form>
  <form class="dlg-add" id="newListForm">
    <input id="newListName" placeholder="New list name" autocomplete="off">
    <button type="submit">Add</button>
  </form>
</dialog>

<script src="https://s3.tradingview.com/tv.js"></script>

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;

  const gi = +el.dataset.group;
  switch (el.dataset.action) {
    case 'select':
      state.symbol = el.dataset.symbol; update(true); break;
    case 'remove': {
      e.stopPropagation();
      const g = list.groups[gi]; g.symbols = g.symbols.filter(s => s !== el.dataset.symbol);
      update(false); wsSync(); break;
    }
    case 'toggle-group':
      list.groups[gi].collapsed = !list.groups[gi].collapsed; update(false); break;
    case 'add-group': {
      const name = prompt('Group name'); if (!name) return;
      list.groups.push({ name: name.trim(), collapsed: false, symbols: [] }); update(false); break;
    }
    case 'rename-group': {
      e.stopPropagation();
      const name = prompt('Group name', list.groups[gi].name); if (!name) return;
      list.groups[gi].name = name.trim(); update(false); break;
    }
    case 'delete-group': {
      e.stopPropagation();
      if (!confirm(`Delete group "${list.groups[gi].name}"?`)) return;
      list.groups.splice(gi, 1); update(false); wsSync(); break;
    }
    case 'list':
      state.activeListId = el.dataset.id; update(false); wsSync(); break;
    case 'pin':
      e.stopPropagation();
      if (!(state.pinned || []).includes(el.dataset.symbol)) state.pinned = [...(state.pinned || []), el.dataset.symbol];
      update(false); wsSync(); break;
    case 'unpin':
      e.stopPropagation();
      if (el.closest('.chip') && !confirm(`Remove ${el.dataset.symbol} from the top bar?`)) return;
      state.pinned = state.pinned.filter(x => x !== el.dataset.symbol); update(false); wsSync(); break;
    case 'manage-lists':
      renderListDlg(); $('listDlg').showModal(); break;
    case 'close-dlg':
      $('listDlg').close(); break;
    case 'dlg-delete': {
      const l = state.lists.find(x => x.id === el.dataset.id);
      if (state.lists.length === 1) return alert('Cannot delete the last list');
      if (!confirm(`Delete list "${l.name}"?`)) return;
      state.lists = state.lists.filter(x => x.id !== l.id);

    case 'details':

      if (!noChart(state.symbol)) showSymbol();

    case 'toggle-details':

// Fallback quote source for hosts the websocket rejects: scanner REST polling (any origin, no streaming)
// plus hidden chart widgets whose quoteUpdate stream covers symbols the scanner lacks (broker CFDs).
const POLL_MS = 10000, FEEDER_MAX = 4;
const SCAN_COLS = ['close', 'change', 'premarket_close', 'premarket_change', 'premarket_time', 'postmarket_close', 'postmarket_change', 'postmarket_time',
  'open', 'high', 'low', 'volume', 'average_volume_10d_calc', 'market_cap_basic', 'price_52_week_high', 'price_52_week_low',
  'Perf.W', 'Perf.Y', 'earnings_release_next_date', 'price_target_average', 'description', 'exchange', 'type', 'currency'];
let pollTimer = null;
const feeders = {};
function startPolling() {
  setStatus('poll');
  clearInterval(pollTimer);
  pollNow();
  pollTimer = setInterval(() => { if (!document.hidden) pollNow(); }, POLL_MS);
}
async function pollNow() {
  const tickers = allSymbols();
  if (!tickers.length) return;
  let data;
  try {
    const r = await fetch('https://scanner.tradingview.com/global/scan', { method: 'POST', body: JSON.stringify({ symbols: { tickers }, columns: SCAN_COLS }) });
    data = (await r.json()).data;
  } catch (e) { console.warn('scanner', e); return; }
  const [phase] = sessionPhase();
  const found = new Set();
  for (const row of data) {
    found.add(row.s);
    const d = Object.fromEntries(SCAN_COLS.map((c, i) => [c, row.d[i]]));
    const pre = (d.premarket_time || 0) >= (d.postmarket_time || 0);
    const ext = pre ? ['premarket_close', 'premarket_change'] : ['postmarket_close', 'postmarket_change'];
    const hasExt = d[ext[0]] != null;
    onQuote(row.s, {
      lp: d.close, ch: d.change == null ? null : d.close - d.close / (1 + d.change / 100), chp: d.change,
      rtc: hasExt ? d[ext[0]] : null, rchp: hasExt ? d[ext[1]] : null,
      current_session: !hasExt ? 'market' : phase === 'pre' ? 'pre_market' : phase === 'post' ? 'post_market' : phase === 'open' ? 'market' : 'out_of_session',
      open_price: d.open, high_price: d.high, low_price: d.low, volume: d.volume, average_volume: d.average_volume_10d_calc,
      market_cap_basic: d.market_cap_basic, price_52_week_high: d.price_52_week_high, price_52_week_low: d.price_52_week_low,
      price_percent_change_1_week: d['Perf.W'], price_percent_change_52_week: d['Perf.Y'],
      earnings_release_next_date: d.earnings_release_next_date, price_target_average: d.price_target_average,
      description: d.description, exchange: d.exchange, type: d.type, currency_code: d.currency, update_mode: 'polled',
    });
  }
  syncFeeders(tickers.filter(t => !found.has(t)));
}
// Hidden widgets: one per scanner-missing symbol, asked to stream quotes via the TradingView iframe protocol.
const QUOTE_SUB = JSON.stringify({ provider: 'TradingView', type: 'get', name: 'quoteSubscribe', id: 1, client_id: 'tvwl', data: {} });
function syncFeeders(missing) {
  for (const sym in feeders) if (!missing.includes(sym)) { feeders[sym].el.remove(); delete feeders[sym]; }
  for (const sym of missing.slice(0, FEEDER_MAX)) {
    if (feeders[sym]) continue;
    const el = document.createElement('div');
    el.id = 'feed_' + Math.random().toString(36).slice(2, 8);
    $('feeders').appendChild(el);
    feeders[sym] = { el };
    new TradingView.widget({ container_id: el.id, width: 320, height: 220, symbol: sym, interval: '1', theme: 'dark', locale: 'en',
      hide_top_toolbar: true, hide_legend: true, hide_side_toolbar: true, allow_symbol_change: false, save_image: false, support_host: 'https://www.tradingview.com' });
    setTimeout(() => { const f = el.querySelector('iframe'); if (f) f.contentWindow.postMessage(QUOTE_SUB, '*'); }, 4000);
  }
  // Re-ask every poll so a stalled stream resumes.
  for (const sym in feeders) { const f = feeders[sym].el.querySelector('iframe'); if (f) f.contentWindow.postMessage(QUOTE_SUB, '*'); }
}
function onFeederMessage(e) {
  if (typeof e.data !== 'string' || !e.data.includes('quoteUpdate')) return;
  let m; try { m = JSON.parse(e.data); } catch (_) { return; }
  if (m.name !== 'quoteUpdate') return;
  for (const sym in feeders) {
    const f = feeders[sym].el.querySelector('iframe');
    if (f && f.contentWindow === e.source) {
      const d = m.data;
      onQuote(sym, { lp: d.last_price, ch: d.change, chp: d.change_percent, current_session: 'market', description: d.description, exchange: d.exchange, volume: d.volume, update_mode: 'streaming' });
      return;
    }
  }
}

// Details panel: quote sheet for the selected symbol, built from the merged websocket fields in `raw`.
const fmtN = (v, d = 2) => v == null ? '–' : new Intl.NumberFormat('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const fmtBig = v => v == null ? '–' : v >= 1e12 ? (v / 1e12).toFixed(2) + 'T' : v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(0) + 'K' : String(v);
const fmtPct = v => v == null ? '–' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const signCls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
function fmtDays(unix) {
  if (!unix) return null;
  const d = new Date(unix * 1000), days = Math.round((d - Date.now()) / 864e5);
  const date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return days < 0 ? `${date} (past)` : days === 0 ? `${date}, today` : `${date}, in ${days}d`;
}
function rangeBar(lo, hi, v) {
  if (lo == null || hi == null || v == null || hi <= lo) return '';
  const pct = Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  return `<div class="d-bar"><i style="left:${pct.toFixed(1)}%"></i></div><div class="d-bar-l"><span>${fmtN(lo)}</span><span>${fmtN(hi)}</span></div>`;
}
let detailsSym = null;
function renderDetails() {
  if (!state.detailsOpen) return;

    : '';
  const stale = r.update_mode === 'polled' ? `<div class="d-stale">Polled every 10s</div>` : r.update_mode && r.update_mode.startsWith('delayed') ? `<div class="d-stale">Delayed ${Math.round(parseInt(r.update_mode.split('_').pop(), 10) / 60) || 15} min</div>` : '';
  const html = `
    <div class="d-head">

      <div class="d-price">${v('lp', fmtN(big) + `<small>${cur}</small>`, 'big ' + signCls(extended ? q.e : r.chp))}${v('chg', (r.ch != null ? (r.ch > 0 ? '+' : '') + fmtN(r.ch) : '') + ' ' + fmtPct(r.chp), signCls(r.chp))}</div>
      ${extLine}${stale}

    <div class="d-sec"><h4>Today</h4>
      ${rangeBar(r.low_price, r.high_price, r.lp)}
      ${kv('Open', fmtN(r.open_price))}${kv('Prev close', fmtN(r.prev_close_price))}
      ${kv('Bid / Ask', r.bid != null && r.ask != null ? fmtN(r.bid) + ' / ' + fmtN(r.ask) : null)}
      ${kv('Volume', r.volume != null ? fmtBig(r.volume) + (volRatio ? ` <small class="${volRatio >= 1.5 ? 'up' : ''}">${volRatio.toFixed(1)}× avg</small>` : '') : null)}
    </div>
    ${r.price_52_week_low != null ? `<div class="d-sec"><h4>52 weeks</h4>
      ${rangeBar(r.price_52_week_low, r.price_52_week_high, r.lp)}
      ${kv('1 week', fmtPct(r.price_percent_change_1_week), signCls(r.price_percent_change_1_week))}
      ${kv('52 weeks', fmtPct(r.price_percent_change_52_week), signCls(r.price_percent_change_52_week))}
      ${kv('From ATH', r.all_time_high ? fmtPct((r.lp / r.all_time_high - 1) * 100) : null, 'down')}

      ${kv('Market cap', fmtBig(r.market_cap_basic))}
      ${kv('Next earnings', fmtDays(r.earnings_release_next_date))}
      ${kv('Analyst target', r.price_target_average ? fmtN(r.price_target_average) + ` <small class="${signCls(upside)}">${fmtPct(upside)}</small>` : null)}
    </div>` : ''}`;

  // Same symbol: patch changed values in place (and flash them) instead of rebuilding the panel.
  if (detailsSym === sym) {
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const cur = new Map([...el.querySelectorAll('[data-k]')].map(n => [n.dataset.k, n]));
    const next = [...tmp.querySelectorAll('[data-k]')];
    if (next.length === cur.size && next.every(n => cur.has(n.dataset.k))) {
      for (const n of next) {
        const o = cur.get(n.dataset.k);
        if (o.innerHTML === n.innerHTML) continue;
        const a = parseFloat(o.textContent.replace(/[^\d.-]/g, '')), b = parseFloat(n.textContent.replace(/[^\d.-]/g, ''));
        o.innerHTML = n.innerHTML; o.className = n.className;
        flashNode(o, b > a ? 'f-up' : b < a ? 'f-down' : 'f-same');
      }
      // Range bar markers move without a flash.
      const bars = el.querySelectorAll('.d-bar i'), nb = tmp.querySelectorAll('.d-bar i');
      if (bars.length === nb.length) bars.forEach((b, i) => { b.style.left = nb[i].style.left; });
      return;
    }
  }
  el.innerHTML = html;
  detailsSym = sym;
}
function flashNode(node, cls) {
  if (!node || node.classList.contains('flash')) return;
  node.classList.add('flash', cls);
  node.addEventListener('animationend', () => node.classList.remove('flash', cls), { once: true });
}

// Boot (after every module above is defined).
render();
renderQuotes();
renderSession();
applyDetails();
mountChart();
wsConnect();

// Dev live reload: on localhost, poll the file's Last-Modified and reload when it changes. No-op elsewhere.
if (['localhost', '127.0.0.1'].includes(location.hostname)) (async () => {
  const stamp = async () => { try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }); return r.headers.get('last-modified') || r.headers.get('etag'); } catch (_) { return null; } };
  let last = await stamp();
  setInterval(async () => { const now = await stamp(); if (now && last && now !== last) location.reload(); if (now) last = now; }, 1000);
})();
</script>
