<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e222d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watchlist">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Watchlist</title>
<style>
  /* Mobile-first: the base rules describe a phone (three stacked views behind a bottom nav);
     `@media (min-width: 768px)` lays the same pieces out side by side for tablets and desktops. */
  :root {
    --bg: #131722; --bg2: #1e222d; --bg3: #2a2e39; --border: #2a2e39;
    --text: #d1d4dc; --muted: #787b86; --accent: #2962ff; --accent-bg: #1c2a52;
    --up: #089981; --down: #f23645; --warn: #f7a600;
    --nav-h: 50px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; padding-top: env(safe-area-inset-top, 0px); }
  @media (display-mode: standalone) { body { position: fixed; inset: 0; height: auto; } }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; }
  .num { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* ---------- Top bar: watchlist tabs + feed status (chart view on phones, always on desktop) ---------- */
  .bar { display: none; align-items: center; gap: 6px; padding: 4px 8px; min-width: 0;
    border-bottom: 1px solid var(--border); background: var(--bg2); }
  body[data-mview="chart"] .bar { display: flex; }
  .bar [data-action="manage-lists"], .bar #chartToggle { display: none; }
  body.sess-open .bar { background: rgba(8, 153, 129, .16); }
  body.sess-pre .bar { background: rgba(247, 166, 0, .16); }
  body.sess-post .bar { background: rgba(79, 140, 255, .16); }
  body.sess-night .bar { background: rgba(176, 108, 255, .16); }
  .tabs { display: flex; flex: 1; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 8px; white-space: nowrap;
    color: var(--muted); font-weight: 500; }
  .tab.on { background: var(--bg3); color: #fff; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .badge:empty { display: none; }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .badge.up i { background: var(--up); } .badge.down i { background: var(--down); }
  .icon { width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px; flex-shrink: 0; }
  .spacer { flex: 1; }
  .status { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex-shrink: 0; }
  .status.live { background: var(--up); } .status.off { background: var(--down); } .status.poll { background: var(--warn); }
  .upd { white-space: nowrap; font-size: 13px; font-weight: 500; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .upd.err { color: var(--down); }
  .upd.pulse { animation: pulse .6s ease-out; }
  @keyframes pulse { 0% { color: var(--text); background: var(--accent-bg); } 100% { color: var(--muted); background: transparent; } }
  #chartToggle svg { display: block; }
  #chartToggle .i-show, #chartToggle.off .i-hide { display: none; }
  #chartToggle.off .i-show { display: block; }

  /* ---------- Pinned tape (lists + chart views on phones, always on desktop) ---------- */
  .taperow { display: none; align-items: center; background: var(--bg2); border-bottom: 1px solid var(--border); }
  body[data-mview="lists"] .taperow, body[data-mview="chart"] .taperow { display: flex; }
  .tape { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 4px 8px; overflow-x: auto; scrollbar-width: none; font-variant-numeric: tabular-nums; }
  .tape::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 8px; white-space: nowrap;
    color: var(--text); flex-shrink: 0; line-height: 1.1; }
  .chip.on { box-shadow: inset 0 0 0 1px var(--accent); }
  .chip .sym { font-weight: 600; font-size: 12px; }
  .chip .sym small { font-weight: 400; font-size: 9px; color: var(--muted); margin-left: 3px; }
  .chip .q { display: flex; align-items: baseline; gap: 4px; }
  .chip .px { display: none; font-size: 12px; }
  .chip .chg { font-size: 11px; }
  .chip .ext, .chip .px:empty, .chip .chg:empty { display: none; }
  .chip .x { display: none; color: var(--muted); font-size: 13px; }
  .chip.nochart, .row.nochart { cursor: default; }
  .chip.nochart .sym, .row.nochart .sym { color: var(--muted); font-weight: 500; }
  .chip.s-up-1 { background: rgba(8, 153, 129, .12); } .chip.s-up-2 { background: rgba(8, 153, 129, .24); }
  .chip.s-up-3 { background: rgba(8, 153, 129, .40); } .chip.s-up-4 { background: rgba(8, 153, 129, .60); }
  .chip.s-down-1 { background: rgba(242, 54, 69, .12); } .chip.s-down-2 { background: rgba(242, 54, 69, .24); }
  .chip.s-down-3 { background: rgba(242, 54, 69, .40); } .chip.s-down-4 { background: rgba(242, 54, 69, .60); }
  .chip[class*="s-up-"] .px, .chip[class*="s-up-"] .chg, .chip[class*="s-down-"] .px, .chip[class*="s-down-"] .chg { color: var(--text); }

  /* ---------- Breadth summary + sparkline (desktop only) ---------- */
  .breadth { display: none; align-items: center; gap: 12px; padding: 5px 10px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .breadth:empty { display: none; }
  .breadth .meter { flex: 1; min-width: 0; height: 6px; display: grid; border-radius: 3px; overflow: hidden; background: var(--bg3); }
  .breadth .meter .t-d4 { background: rgba(242, 54, 69, 1); }   .breadth .meter .t-d3 { background: rgba(242, 54, 69, .72); }
  .breadth .meter .t-d2 { background: rgba(242, 54, 69, .48); } .breadth .meter .t-d1 { background: rgba(242, 54, 69, .28); }
  .breadth .meter .t-0 { background: var(--bg3); }
  .breadth .meter .t-u1 { background: rgba(8, 153, 129, .28); } .breadth .meter .t-u2 { background: rgba(8, 153, 129, .48); }
  .breadth .meter .t-u3 { background: rgba(8, 153, 129, .72); } .breadth .meter .t-u4 { background: rgba(8, 153, 129, 1); }
  .breadth .stat { white-space: nowrap; flex-shrink: 0; }
  .breadth .stat b { font-weight: 600; color: var(--text); }
  .breadth .srange { font-size: 10px; color: var(--muted); flex-shrink: 0; cursor: pointer; }
  .spark { display: block; width: 200px; height: 36px; cursor: pointer; flex-shrink: 0; }
  .spark .lbl { font-size: 7px; fill: var(--muted); }
  .spark .zero { stroke: var(--muted); stroke-opacity: .5; stroke-dasharray: 2 2; }
  .spark .line { fill: none; stroke-width: 1.5; }
  .spark .area { opacity: .18; }
  .spark .up { stroke: var(--up); } .spark .down { stroke: var(--down); }
  .spark .area.up { fill: var(--up); } .spark .area.down { fill: var(--down); }
  .spark .dot { fill: var(--text); stroke: var(--bg); stroke-width: 1; }
  .stip { position: fixed; z-index: 20; pointer-events: none; background: var(--bg3); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .stip b { font-weight: 600; }
  .tpop { position: fixed; z-index: 20; pointer-events: none; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px 4px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .tpop .t { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; margin-bottom: 2px; }

  /* ---------- Views: one of lists / list / chart on screen, picked by the bottom nav ---------- */
  .body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .mlists, .panel, .details, .chart, .resizer { display: none; }
  body[data-mview="lists"] .mlists { display: block; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body[data-mview="list"] .panel { display: flex; }
  body[data-mview="chart"] .chart { display: flex; }
  /* Symbol details: full-screen sheet above the current view, closed with its × */
  body.details-open .details { display: block; position: fixed; left: 0; right: 0; top: 0; z-index: 50;
    bottom: calc(var(--nav-h) + max(0px, calc(var(--safe-b) - 12px))); }
  .mnav { position: relative; flex-shrink: 0; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--bg2); border-top: 1px solid var(--border);
    /* clear the home indicator, but not the full inset: the buttons sit low, like native tab bars */
    padding-bottom: max(0px, calc(var(--safe-b) - 12px)); }
  .mnav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: var(--nav-h);
    color: var(--muted); font-size: 10px; }
  .mnav button svg { width: 20px; height: 20px; }
  .mnav button.on { color: var(--text); }
  .mnav button.on svg { color: var(--accent); }
  .mnav .ver { position: absolute; right: 6px; bottom: 3px; font-size: 9px; color: var(--muted); opacity: .7; pointer-events: none; }

  /* ---------- Lists view: one card per watchlist, tinted by its sentiment ---------- */
  .ml-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; }
  .ml-row.on { box-shadow: inset 3px 0 0 var(--accent); }
  .ml-row .n { grid-column: 1; grid-row: 1; font-size: 18px; font-weight: 600; }
  .ml-row .c { grid-column: 1; grid-row: 2; font-size: 12px; color: var(--muted); }
  .ml-row .b { grid-column: 2; grid-row: 1 / span 2; text-align: right; font-variant-numeric: tabular-nums; font-size: 16px; }
  .ml-row .b small { display: block; font-size: 12px; color: var(--muted); }
  .ml-row[class*="s-"] .b { color: var(--text); }
  .ml-row.s-up-1 { background: rgba(8, 153, 129, .10); }   .ml-row.s-up-2 { background: rgba(8, 153, 129, .20); }
  .ml-row.s-up-3 { background: rgba(8, 153, 129, .34); }   .ml-row.s-up-4 { background: rgba(8, 153, 129, .50); }
  .ml-row.s-down-1 { background: rgba(242, 54, 69, .10); } .ml-row.s-down-2 { background: rgba(242, 54, 69, .20); }
  .ml-row.s-down-3 { background: rgba(242, 54, 69, .34); } .ml-row.s-down-4 { background: rgba(242, 54, 69, .50); }

  /* ---------- List view: the active watchlist ---------- */
  .panel { flex: 1; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
  .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .cols, .row { display: grid; grid-template-columns: 1fr 84px 64px 70px; gap: 6px; align-items: center; padding: 0 12px; }
  .cols { height: 32px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .cols span:not(:first-child) { text-align: right; }
  .row { height: 44px; cursor: pointer; font-size: 15px; font-variant-numeric: tabular-nums; position: relative;
    border-left: 2px solid transparent; }
  .row.on { background: var(--accent-bg); border-left-color: var(--accent); }
  .row .sym { display: flex; align-items: center; gap: 4px; font-weight: 600; min-width: 0; }
  .row .sym .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .q { display: contents; }
  .row .px, .row .chg, .row .ext { text-align: right; }
  .row .px { padding: 3px 6px; border-radius: 5px; margin-right: -6px; }
  .row .ext { font-size: 13px; display: flex; align-items: center; justify-content: flex-end; }
  .row .ext .v { min-width: 50px; text-align: right; }
  .row .px:empty::before, .row .chg:empty::before, .row .ext:empty::before { content: '–'; color: var(--muted); }
  .panel.no-ext .cols, .panel.no-ext .row { grid-template-columns: 1fr 84px 64px; }
  .panel.no-ext .cols span:last-child, .panel.no-ext .ext { display: none; }
  /* Sentiment tiers tint the Last cell (a pill) instead of the whole row. */
  .row.s-up-1 .px { background: rgba(8, 153, 129, .16); }   .row.s-up-2 .px { background: rgba(8, 153, 129, .30); }
  .row.s-up-3 .px { background: rgba(8, 153, 129, .48); }   .row.s-up-4 .px { background: rgba(8, 153, 129, .70); }
  .row.s-down-1 .px { background: rgba(242, 54, 69, .16); } .row.s-down-2 .px { background: rgba(242, 54, 69, .30); }
  .row.s-down-3 .px { background: rgba(242, 54, 69, .48); } .row.s-down-4 .px { background: rgba(242, 54, 69, .70); }
  .row[class*="s-up-"] .px, .row[class*="s-down-"] .px { color: var(--text); }
  .ss { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .ss.pre { background: var(--warn); } .ss.post { background: #4f8cff; } .ss.night { background: #b06cff; }
  /* Row tools: star / info / remove. Hidden until hover on desktop; on the selected row on touch screens. */
  .row .icon { width: 24px; height: 24px; font-size: 13px; opacity: 0; background: transparent; }
  @media (hover: none) { .row.on .icon { opacity: 1; } }
  .row .icon.info, .row .icon.rm { background: var(--bg3); }   /* inline after the name on phones, pinned right on desktop */
  .row .icon.info { font: italic 600 11px Georgia, serif; }
  .row .icon.star.on { opacity: 1; color: var(--warn); background: transparent; }
  .earn { flex-shrink: 0; font-size: 9px; font-weight: 600; line-height: 1; padding: 2px 4px; border-radius: 3px;
    color: var(--warn); border: 1px solid rgba(247, 166, 0, .55); letter-spacing: .02em; }
  .earn.soon { background: var(--warn); color: var(--bg); border-color: var(--warn); }
  .row.dragging { opacity: .4; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .gtab.drop-into { box-shadow: inset 0 0 0 1px var(--accent); }
  .group { border-top: 1px solid var(--border); }
  .gtab { position: relative; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px;
    background: var(--bg3); cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text); }
  .gtab .chev { color: var(--muted); font-size: 9px; transition: transform .15s; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .gname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gtools { display: flex; gap: 2px; opacity: .6; }
  .gtools .icon { width: 24px; height: 24px; font-size: 12px; }
  .gcount { padding: 8px 12px; font-size: 12px; color: var(--muted); }
  .empty { padding: 20px 12px; color: var(--muted); text-align: center; }
  .flash { animation: cell .9s ease-out; border-radius: 3px; }
  .f-up { --fl: rgba(8, 153, 129, .45); } .f-down { --fl: rgba(242, 54, 69, .45); } .f-same { --fl: rgba(41, 98, 255, .35); }
  @keyframes cell { 0% { background: var(--fl); } 100% { background: transparent; } }
  /* End-of-day summary card */
  .eod { border-top: 1px solid var(--border); background: var(--bg2); font-size: 12px; }
  .eod:empty { display: none; }
  .eod-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; user-select: none; }
  .eod-h b { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .eod-h .d { color: var(--muted); white-space: nowrap; }
  .eod-h .b { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 11px; }
  .eod-h .x { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .eod-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; padding: 0 12px 8px; font-variant-numeric: tabular-nums; }
  .eod-body .col > div { display: flex; justify-content: space-between; padding: 1px 0; }
  .eod-body .col span:first-child { font-weight: 600; }
  .eod.collapsed .eod-body { display: none; }
  /* Selected symbol strip under the list (+ add when it is not in this list) */
  .selbar { display: none; grid-template-columns: auto 1fr auto; gap: 0 10px; align-items: center; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--bg2); }
  .selbar:empty { display: none; }
  .selbar .ssym { font-weight: 700; font-size: 16px; }
  .selbar .ssym small { font-size: 10px; font-weight: 400; color: var(--muted); margin-left: 4px; }
  .selbar .sdesc { min-width: 0; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selbar .q { display: flex; align-items: baseline; gap: 8px; justify-content: flex-end; font-variant-numeric: tabular-nums; }
  .selbar .q .px { font-size: 17px; font-weight: 600; }
  .selbar .q .chg { font-size: 13px; font-weight: 500; }
  .selbar .q .ext { display: none; }
  .selbar .sadd { grid-column: 1 / -1; justify-self: stretch; margin-top: 6px; background: var(--accent); color: #fff; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-weight: 500; }
  .add { display: none; }   /* legacy add box; the palette and the chart sheet add symbols now */

  /* ---------- Chart view: widget + chart bar (symbol · price · countdown · interval) ---------- */
  .chart { flex-direction: column; flex: 1; min-width: 0; min-height: 0; position: relative; }
  #tv_chart { position: relative; flex: 1; min-height: 0; }
  .mbar { position: relative; z-index: 41; display: flex; align-items: stretch; flex-shrink: 0; height: 48px;
    border-top: 1px solid var(--border); background: var(--bg2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mbar .msym { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; padding: 0 12px 0 14px;
    font-size: 19px; font-weight: 700; color: var(--text); text-align: left; }
  .mbar .msym small { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 500; color: var(--muted); }
  .mbar .mbt { display: flex; align-items: baseline; gap: 10px; align-self: center; padding-right: 12px; }
  .mbar .px { font-size: 19px; font-weight: 600; }
  .mbar .chg { font-size: 15px; }
  .mbar .cd { font-size: 15px; color: var(--muted); }
  .mbar .cd b { color: var(--text); font-weight: 600; }
  .mbar .cd b.soon { color: var(--warn); }
  .ivsel { position: static; display: flex; flex-shrink: 0; }
  .ivbtn { display: inline-flex; align-items: center; height: 100%; padding: 0 14px; font-size: 15px; font-weight: 600;
    font-variant-numeric: tabular-nums; color: var(--text); background: var(--bg3); border-left: 1px solid var(--border); }
  /* Interval picker: a bottom sheet above the chart bar */
  .ivmenu { position: absolute; left: 0; right: 0; bottom: 100%; z-index: 40; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    padding: 14px 16px 16px; background: var(--bg2); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0;
    box-shadow: 0 -10px 30px rgba(0,0,0,.5); }
  .ivmenu[hidden] { display: none; }
  .ivmenu::before { content: ''; grid-column: 1 / -1; justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--bg3); margin-bottom: 2px; }
  .ivmenu button { padding: 14px 0; border-radius: 8px; font-size: 16px; font-weight: 600; color: var(--muted); background: var(--bg); }
  .ivmenu button.on { color: #fff; background: var(--accent); }
  .ivbackdrop { position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, .45); }
  .ivbackdrop[hidden] { display: none; }
  /* Symbol picker: fills the chart area; list rows scroll, list chips + search stay at the bottom */
  .symmenu { position: absolute; left: 0; right: 0; top: 0; bottom: 48px; z-index: 40; display: flex; flex-direction: column; background: var(--bg2); }
  .symmenu[hidden] { display: none; }
  .symmenu #symRows { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px; }
  .symmenu .symbot { flex: none; padding: 8px; border-top: 1px solid var(--border); background: var(--bg2); }
  .symmenu .symbot input { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; outline: none; }
  .symmenu .symbot input:focus { border-color: var(--accent); }
  .lchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .lchips::-webkit-scrollbar { display: none; }

const intervalLabel = v => INTERVALS.find(x => x[1] === v)?.[0] || (/^\d+$/.test(v) ? (+v < 60 ? v + 'm' : (+v / 60) + 'h') : (/^\d/.test(v) ? v : '1' + v));

// Chart HUD: countdown to the current bar's close (aligned to the symbol's session, like TradingView) + live price.
function tzNow(tz) {
  const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour12: false, weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date());
  const g = t => parts.find(x => x.type === t).value;
  return { wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')), sec: ((+g('hour') % 24) * 3600) + (+g('minute') * 60) + (+g('second')) };
}
function barCloseIn(sym, interval) {
  const r = raw[sym] || {};
  const tz = r.timezone || 'America/New_York';
  const sess = r['session-regular'] || '';
  const m = /^(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(sess);
  const allDay = !m || sess.startsWith('24x7') || (m[1] === '00' && m[2] === '00' && m[3] === '00' && m[4] === '00');
  const open = allDay ? 0 : (+m[1] * 60 + +m[2]) * 60, close = allDay ? 86400 : (+m[3] * 60 + +m[4]) * 60;
  const { wd, sec } = tzNow(tz);
  if (/^\d+$/.test(interval)) {
    const n = +interval * 60;
    const base = sec >= open ? open : 0;                       // intraday bars align to session open (pre-market: midnight)
    const start = base + Math.floor((sec - base) / n) * n;
    return start + n - sec;
  }
  const days = interval === 'W' ? (allDay ? (7 - wd) % 7 || 7 : ((5 - wd) + 7) % 7) : 0;  // week closes Fri (session) or Sun 00:00 (24x7)
  let left = close - sec + days * 86400;
  if (left <= 0) left += 86400 * (allDay ? 1 : (wd === 5 ? 3 : wd === 6 ? 2 : 1));
  return left;
}

// Chart bar: symbol + company, live price / change and the bar-close countdown (refreshed every second).
function renderHud() {
  if (!state.symbol) return;
  const q = quotes[state.symbol];
  const left = barCloseIn(state.symbol, state.interval);
  const price = q ? (!regular && q.ep != null ? q.ep : q.p) : null;
  const chg = q ? (!regular && q.e != null ? q.e : q.c) : null;
  const sym = state.symbol, short = sym.includes(':') ? sym.split(':')[1] : sym;
  const desc = raw[sym]?.description || '';
  $('mbarSym').innerHTML = `${esc(short)}<small>${esc(desc.toUpperCase() === short ? '' : desc)}</small>`;
  $('mbarText').innerHTML = `<span class="px ${signCls(chg)}">${price != null ? fmtN(price) : ''}</span><span class="chg ${signCls(chg)}">${price != null ? fmtPct(chg) : ''}</span>` +
    `<span class="cd"><b class="${left <= 10 ? 'soon' : ''}">${fmtCountdown(Math.max(0, Math.round(left)))}</b></span>`;
}
setInterval(() => { if (!document.hidden) renderHud(); }, 1000);

// Keyboard: ↑/↓ move through the active list's chartable tickers, ←/→ switch watchlists.
document.addEventListener('keydown', e => {

  if (/^[a-zA-Z]$/.test(e.key)) { openCmd('symbol', e.key.toUpperCase()); e.preventDefault(); return; }
  if (/^[0-9]$/.test(e.key)) { openCmd('interval', e.key); e.preventDefault(); return; }

// Fallback quote source for hosts the websocket rejects: scanner REST polling (any origin, no streaming)
// plus hidden chart widgets whose quoteUpdate stream covers symbols the scanner lacks (broker CFDs).
const POLL_MS = 10000, FEEDER_MAX = 4;
const SCAN_COLS = ['close', 'change', 'premarket_close', 'premarket_change', 'premarket_time', 'postmarket_close', 'postmarket_change', 'postmarket_time',
  'open', 'high', 'low', 'volume', 'average_volume_10d_calc', 'market_cap_basic', 'price_52_week_high', 'price_52_week_low',
  'Perf.W', 'Perf.Y', 'earnings_release_next_date', 'price_target_average', 'description', 'exchange', 'type', 'currency'];
let pollTimer = null;
const feeders = {};
function startPolling() {
  setStatus('poll');
  clearInterval(pollTimer);
  pollNow();
  pollTimer = setInterval(() => { if (!document.hidden) pollNow(); }, POLL_MS);
}
async function pollNow() {
  const tickers = allSymbols();
  if (!tickers.length) return;
  let data;
  try {
    const r = await fetch('https://scanner.tradingview.com/global/scan', { method: 'POST', body: JSON.stringify({ symbols: { tickers }, columns: SCAN_COLS }) });
    data = (await r.json()).data;
  } catch (e) { console.warn('scanner', e); return; }
  const [phase] = sessionPhase();
  const found = new Set();
  for (const row of data) {
    found.add(row.s);
    const d = Object.fromEntries(SCAN_COLS.map((c, i) => [c, row.d[i]]));
    const pre = (d.premarket_time || 0) >= (d.postmarket_time || 0);
    const ext = pre ? ['premarket_close', 'premarket_change'] : ['postmarket_close', 'postmarket_change'];
    const hasExt = d[ext[0]] != null;
    onQuote(row.s, {
      lp: d.close, ch: d.change == null ? null : d.close - d.close / (1 + d.change / 100), chp: d.change,
      rtc: hasExt ? d[ext[0]] : null, rchp: hasExt ? d[ext[1]] : null,
      current_session: !hasExt ? 'market' : phase === 'pre' ? 'pre_market' : phase === 'post' ? 'post_market' : phase === 'open' ? 'market' : 'out_of_session',
      open_price: d.open, high_price: d.high, low_price: d.low, volume: d.volume, average_volume: d.average_volume_10d_calc,
      market_cap_basic: d.market_cap_basic, price_52_week_high: d.price_52_week_high, price_52_week_low: d.price_52_week_low,
      price_percent_change_1_week: d['Perf.W'], price_percent_change_52_week: d['Perf.Y'],
      earnings_release_next_date: d.earnings_release_next_date, price_target_average: d.price_target_average,
      description: d.description, exchange: d.exchange, type: d.type, currency_code: d.currency, update_mode: 'polled',
    });
  }
  syncFeeders(tickers.filter(t => !found.has(t)));
}
// Hidden widgets: one per scanner-missing symbol, asked to stream quotes via the TradingView iframe protocol.
const QUOTE_SUB = JSON.stringify({ provider: 'TradingView', type: 'get', name: 'quoteSubscribe', id: 1, client_id: 'tvwl', data: {} });
function syncFeeders(missing) {
  for (const sym in feeders) if (!missing.includes(sym)) { feeders[sym].el.remove(); delete feeders[sym]; }
  for (const sym of missing.slice(0, FEEDER_MAX)) {
    if (feeders[sym]) continue;
    const el = document.createElement('div');
    el.id = 'feed_' + Math.random().toString(36).slice(2, 8);
    $('feeders').appendChild(el);
    feeders[sym] = { el };
    new TradingView.widget({ container_id: el.id, width: 320, height: 220, symbol: sym, interval: '1', theme: 'dark', locale: 'en',
      hide_top_toolbar: true, hide_legend: true, hide_side_toolbar: true, allow_symbol_change: false, save_image: false, support_host: 'https://www.tradingview.com' });
    setTimeout(() => { const f = el.querySelector('iframe'); if (f) f.contentWindow.postMessage(QUOTE_SUB, '*'); }, 4000);
  }
  // Re-ask every poll so a stalled stream resumes.
  for (const sym in feeders) { const f = feeders[sym].el.querySelector('iframe'); if (f) f.contentWindow.postMessage(QUOTE_SUB, '*'); }

function onFeederMessage(e) {
  if (typeof e.data !== 'string' || !e.data.includes('quoteUpdate')) return;
  let m; try { m = JSON.parse(e.data); } catch (_) { return; }
  if (m.name !== 'quoteUpdate') return;
  for (const sym in feeders) {
    const f = feeders[sym].el.querySelector('iframe');
    if (f && f.contentWindow === e.source) {
      const d = m.data;
      onQuote(sym, { lp: d.last_price, ch: d.change, chp: d.change_percent, current_session: 'market', description: d.description, exchange: d.exchange, volume: d.volume, update_mode: 'streaming' });
      return;
    }
  }
}

// Details panel: quote sheet for the selected symbol, built from the merged websocket fields in `raw`.
const fmtN = (v, d = 2) => v == null ? '–' : new Intl.NumberFormat('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const fmtBig = v => v == null ? '–' : v >= 1e12 ? (v / 1e12).toFixed(2) + 'T' : v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(0) + 'K' : String(v);
const fmtPct = v => v == null ? '–' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const signCls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
function fmtDays(unix) {
  if (!unix) return null;
  const d = new Date(unix * 1000), days = Math.round((d - Date.now()) / 864e5);
  const date = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return days < 0 ? `${date} (past)` : days === 0 ? `${date}, today` : `${date}, in ${days}d`;
}
function rangeBar(lo, hi, v) {
  if (lo == null || hi == null || v == null || hi <= lo) return '';
  const pct = Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  return `<div class="d-bar"><i style="left:${pct.toFixed(1)}%"></i></div><div class="d-bar-l"><span>${fmtN(lo)}</span><span>${fmtN(hi)}</span></div>`;
}
let detailsSym = null;
function renderDetails() {
  if (!state.detailsOpen) return;
  const el = $('dbody'), sym = state.symbol, r = raw[sym], q = quotes[sym];
  if (!sym || !r || r.lp == null) {
    detailsSym = null;
    el.innerHTML = `<div class="d-empty">${sym ? 'Waiting for data for ' + esc(sym) + '…' : 'Select a symbol in the list to see its details.'}</div>`;
    return;
  }
  const [ex, short] = sym.includes(':') ? sym.split(':') : ['', sym];
  const cur = r.currency_code ? ' ' + r.currency_code : '';
  const v = (k, html, cls = '') => `<span data-k="${k}" class="${cls}">${html}</span>`;
  const kv = (k, html, cls = '') => html == null || html === '–' ? '' : `<div class="d-kv"><span>${k}</span>${v(k, html, cls)}</div>`;
  const stock = r.type === 'stock' || r.type === 'dr' || r.type === 'fund';
  const volRatio = r.volume && r.average_volume ? (r.volume / r.average_volume) : null;
  const upside = r.price_target_average && r.lp ? (r.price_target_average / r.lp - 1) * 100 : null;
  // Header mirrors the list: outside the regular session the big price is the extended-session price.
  const extended = q && q.ep != null && !regular;
  const big = extended ? q.ep : r.lp;
  const extLine = extended
    ? `<div class="d-ext"><i class="ss ${q.ss}"></i>${q.es} ${v('extp', fmtPct(q.e), signCls(q.e))}<span class="d-sep">·</span>Close ${v('close', fmtN(r.lp))}</div>`
    : '';
  const stale = r.update_mode === 'polled' ? `<div class="d-stale">Polled every 10s</div>` : r.update_mode && r.update_mode.startsWith('delayed') ? `<div class="d-stale">Delayed ${Math.round(parseInt(r.update_mode.split('_').pop(), 10) / 60) || 15} min</div>` : '';
  const html = `
    <div class="d-head">
      <div class="d-sym"><b>${esc(short)}</b><small>${esc(r.exchange || ex)}</small></div>
      <div class="d-desc" title="${esc(r.description || '')}">${esc(r.description || '')}</div>
      <div class="d-price">${v('lp', fmtN(big) + `<small>${cur}</small>`, 'big ' + signCls(extended ? q.e : r.chp))}${v('chg', (r.ch != null ? (r.ch > 0 ? '+' : '') + fmtN(r.ch) : '') + ' ' + fmtPct(r.chp), signCls(r.chp))}</div>
      ${extLine}${stale}
    </div>
    <div class="d-sec"><h4>Today</h4>
      ${rangeBar(r.low_price, r.high_price, r.lp)}
      ${kv('Open', fmtN(r.open_price))}${kv('Prev close', fmtN(r.prev_close_price))}
      ${kv('Bid / Ask', r.bid != null && r.ask != null ? fmtN(r.bid) + ' / ' + fmtN(r.ask) : null)}
      ${kv('Volume', r.volume != null ? fmtBig(r.volume) + (volRatio ? ` <small class="${volRatio >= 1.5 ? 'up' : ''}">${volRatio.toFixed(1)}× avg</small>` : '') : null)}
    </div>
    ${r.price_52_week_low != null ? `<div class="d-sec"><h4>52 weeks</h4>
      ${rangeBar(r.price_52_week_low, r.price_52_week_high, r.lp)}
      ${kv('1 week', fmtPct(r.price_percent_change_1_week), signCls(r.price_percent_change_1_week))}
      ${kv('52 weeks', fmtPct(r.price_percent_change_52_week), signCls(r.price_percent_change_52_week))}
      ${kv('From ATH', r.all_time_high ? fmtPct((r.lp / r.all_time_high - 1) * 100) : null, 'down')}
    </div>` : ''}
    ${stock ? `<div class="d-sec"><h4>Company</h4>
      ${kv('Market cap', fmtBig(r.market_cap_basic))}
      ${kv('Next earnings', fmtDays(r.earnings_release_next_date))}
      ${kv('Analyst target', r.price_target_average ? fmtN(r.price_target_average) + ` <small class="${signCls(upside)}">${fmtPct(upside)}</small>` : null)}
    </div>` : ''}`;

  // Same symbol: patch changed values in place (and flash them) instead of rebuilding the panel.
  if (detailsSym === sym) {
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const cur = new Map([...el.querySelectorAll('[data-k]')].map(n => [n.dataset.k, n]));
    const next = [...tmp.querySelectorAll('[data-k]')];
    if (next.length === cur.size && next.every(n => cur.has(n.dataset.k))) {
      for (const n of next) {
        const o = cur.get(n.dataset.k);
        if (o.innerHTML === n.innerHTML) continue;
        const a = parseFloat(o.textContent.replace(/[^\d.-]/g, '')), b = parseFloat(n.textContent.replace(/[^\d.-]/g, ''));
        o.innerHTML = n.innerHTML; o.className = n.className;
        flashNode(o, b > a ? 'f-up' : b < a ? 'f-down' : 'f-same');
      }
      // Range bar markers move without a flash.
      const bars = el.querySelectorAll('.d-bar i'), nb = tmp.querySelectorAll('.d-bar i');
      if (bars.length === nb.length) bars.forEach((b, i) => { b.style.left = nb[i].style.left; });
      return;
    }
  }
  el.innerHTML = html;
  detailsSym = sym;
}
function flashNode(node, cls) {
  if (!node || node.classList.contains('flash')) return;
  node.classList.add('flash', cls);
  node.addEventListener('animationend', () => node.classList.remove('flash', cls), { once: true });
}

// Boot (after every module above is defined).
render();
renderQuotes();
renderSession();
applyDetails();
if (window.innerWidth < 768 && state.detailsOpen) { state.detailsOpen = false; applyDetails(); }
setMobileView(['lists', 'list', 'chart'].includes(state.mview) ? state.mview : 'list');
mountChart();
renderHud();
wsConnect();

// Dev live reload: on localhost, poll the file's Last-Modified and reload when it changes. No-op elsewhere.
const IS_LAN = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
const IS_DEV = ['localhost', '127.0.0.1'].includes(location.hostname) || IS_LAN;
// Prod: the PWA and GitHub Pages (max-age=600) happily serve a stale page. On load and whenever the app comes back
// to the foreground, fetch the live index.html uncached and compare its APP_VERSION with ours; reload on a mismatch.
if (!IS_DEV) {
  const check = async () => {
    try {
      const r = await fetch(location.pathname, { cache: 'no-store' });
      const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
      if (m && m[1] !== APP_VERSION) location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    } catch (_) {}
  };
  setTimeout(check, 2000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
}
if (IS_DEV) (async () => {
  const stamp = async () => { try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }); return r.headers.get('last-modified') || r.headers.get('etag'); } catch (_) { return null; } };
  let last = await stamp();
  setInterval(async () => { const now = await stamp(); if (now && last && now !== last) location.reload(); if (now) last = now; }, 1000);
})();
</script>
</body>
</html>
